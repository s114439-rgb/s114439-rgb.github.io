<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヨルシカ (Yorushika) 歌詞隨機抽選</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #2c3e50;
            --accent-color: #8faec4;
            /* 調整卡片底色為半透明白色，以利搭配毛玻璃效果 */
            --card-bg: rgba(255, 255, 255, 0.75); 
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Noto Sans TC', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;

            /* ==================== 背景圖設定 ==================== */
            /* 請在下方 url('...') 內填入你的圖片網址，或是跟 HTML 同資料夾的圖片檔名 */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Yorushika_Logo.jpg/250px-Yorushika_Logo.jpg'); 
            
            background-size: cover;       /* 讓圖片等比例縮放，填滿整個螢幕 */
            background-position: center;  /* 讓圖片居中對齊 */
            background-repeat: no-repeat; /* 防止圖片重複拼貼 */
            background-attachment: fixed; /* 讓背景圖固定，不會隨頁面滾動 */
            /* =================================================== */
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 2rem;
            color: #4a5e75; /* 稍微加深顏色，確保在背景圖上清晰 */
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8); /* 加上文字微陰影 */
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(8px); /* 毛玻璃模糊效果 */
            -webkit-backdrop-filter: blur(8px); /* 瀏覽器相容性 */
            padding: 3rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); /* 稍微加深陰影使其更立體 */
            min-height: 180px;
